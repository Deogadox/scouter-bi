<div id="stage"><div id="app">
  <div class="card" id="pipe"><div class="hd"><h3><span class="dot"></span>Do dado bruto ao relatório jogável</h3><span class="aux">pipeline completo, versionado no GitHub</span></div><div id="nos"></div></div>
  <div class="card cx" id="c1"><div class="hd"><h3><span class="dot"></span>Curadoria</h3><span class="aux" id="c1a"></span></div><div class="corpo" id="donut"></div></div>

</div></div>

<script>
(function () {
  var D = U.D, M = D.meta || {}, $ = function (id) { return document.getElementById(id); }, app = $("app");
  app.insertAdjacentHTML("beforeend", U.marca("Bastidores"));
  var n = function (v) { return (v || 0).toLocaleString("pt-BR"); };

  var NOS = [
    ["🛰️", "Dragon Ball API", n(M.nApi) + " personagens, " + n(M.nPl) + " planetas e " + n(M.nTr) + " transformações, extraídos com paginação.", "API REST pública"],
    ["🐍", "Python", "Extração com retry e um parser que converte “19.84 Septillion” em número.", "requests · pandas · pytest"],
    ["🗄️", "SQL Server", "Camadas stg → dw. Procedures validam chaves e duplicidade; cada carga vai para o log.", "T-SQL · procedures"],
    ["⭐", "Modelo estrela", "2 fatos e 4 dimensões: " + n(M.nPod) + " níveis de poder curados e " + n(M.nLut) + " lutas canônicas.", "DAX · TMDL · PBIP"],
    ["🎮", "Power BI + HTML", "O DAX entrega os dados em JSON e cada página vira um app HTML/JS dentro do relatório.", "HTML Content"]
  ];
  $("nos").innerHTML = NOS.map(function (x, i) {
    return '<div class="no" style="animation-delay:' + i * 90 + 'ms"><div class="tt"><div class="ic">' + x[0] + '</div><div class="t">' + x[1] + '</div></div><div class="d">' + x[2] + '</div><div class="m">' + x[3] + "</div>" +
      (i < NOS.length - 1 ? '<div class="seta"><i></i></div>' : "") + "</div>";
  }).join("");

  // donut da curadoria
  var parts = [["Canônico (na obra)", M.nCan, "#39ff88"], ["Guia oficial", M.nGuia, "#ffc21a"], ["Estimado (regra)", M.nEst, "#8fa3c8"]];
  var tot = parts.reduce(function (s, p) { return s + (p[1] || 0); }, 0) || 1, a0 = -Math.PI / 2, arcs = "";
  parts.forEach(function (p) {
    var a1 = a0 + (p[1] || 0) / tot * Math.PI * 2, R = 52, r = 34, big = a1 - a0 > Math.PI ? 1 : 0;
    var P = function (a, rr) { return (64 + rr * Math.cos(a)).toFixed(2) + " " + (64 + rr * Math.sin(a)).toFixed(2); };
    arcs += '<path d="M' + P(a0, R) + " A" + R + " " + R + " 0 " + big + " 1 " + P(a1, R) + " L" + P(a1, r) + " A" + r + " " + r + " 0 " + big + " 0 " + P(a0, r) + ' Z" fill="' + p[2] + '"/>';
    a0 = a1;
  });
  $("c1a").textContent = n(tot) + " leituras";
  $("donut").innerHTML = '<svg width="128" height="128" viewBox="0 0 128 128">' + arcs + '<text x="64" y="62" text-anchor="middle" font-family="Rajdhani,Segoe UI,sans-serif" font-weight="700" font-size="26" fill="#fff">' + n(tot) +
    '</text><text x="64" y="78" text-anchor="middle" font-size="9" fill="#9aa6c4" font-weight="700">LEITURAS</text></svg><div class="lg">' +
    parts.map(function (p) { return '<div><i style="background:' + p[2] + '"></i>' + p[0] + "<b>" + n(p[1]) + "</b></div>"; }).join("") +
    '<div style="font-size:10.5px;color:#9aa6c4;font-weight:600;margin-top:8px">Todo número tem a origem marcada.</div></div>';

  $("sujos").innerHTML =
    '<div class="it"><span class="q">' + n(M.kiDesc) + '</span><span>ki <code>unknown</code> → status <b>desconhecido</b></span></div>' +
    '<div class="it"><span class="q">' + n(M.kiInc) + '</span><span>ki <code>969 Googolplex</code> → <b>incomensurável</b></span></div>' +
    '<div class="it"><span class="q">1</span><span>typo da API <code>septllion</code> corrigido no parser</span></div>' +
    '<div class="it"><span class="q">2</span><span>formatos no mesmo campo: <code>60.000.000</code> e <code>19.84 Septillion</code></span></div>';

  var vit = M.nVit || 0, acerto = vit ? (vit - (M.nZeb || 0)) / vit : 0;
  $("acc").innerHTML = '<div class="grande num">' + Math.round(acerto * 100) + '%</div><div class="peq">Em <b style="color:#fff">' + n(vit - (M.nZeb || 0)) + " de " + n(vit) +
    "</b> vitórias canônicas, venceu quem tinha mais poder. A única zebra: <b style='color:#fff'>Goku vence Kid Boo com a Genki Dama</b>, energia emprestada que não aparece no scouter.</div>";

  $("chance").innerHTML = '<div class="form">A² ÷ (A² + B²)</div><div class="peq" style="margin-top:0">A e B são os níveis de poder. Quem tem o dobro vence <b style="color:#fff">80%</b> das vezes; quatro vezes mais, <b style="color:#fff">94%</b>.</div>' +
    '<div class="peq">A Arena roda um motor de batalha calibrado para essa mesma curva: 1.000 lutas simuladas chegam ao mesmo número.</div>';

  $("regra").innerHTML = '<table class="tb"><tr><td>Super Saiyajin (SSJ)</td><td>×50</td></tr><tr><td>Super Saiyajin 2 (SSJ2)</td><td>×100</td></tr><tr><td>Super Saiyajin 3 (SSJ3)</td><td>×400</td></tr><tr><td>Kaioken x2, x3, x4…</td><td>×N</td></tr></table>' +
    '<div class="peq">Aplicados sobre a base de cada saga, com uma trava: quem vence uma luta canônica precisa ter mais poder.</div>';

  $("modelo").innerHTML = '<table class="tb"><tr><td><b>fato_poder</b> · personagem × saga × forma</td><td>' + n(M.nPod) + '</td></tr><tr><td><b>fato_luta</b> · luta canônica</td><td>' + n(M.nLut) +
    '</td></tr><tr><td><b>dim_personagem</b> · API + extras curados</td><td>' + n((M.nApi || 0) + (M.nExtra || 0)) + '</td></tr><tr><td><b>dim_saga</b> · ' + n(M.nSagas) + ' sagas do Z</td><td>291 ep.</td></tr></table>' +
    '<div class="peq">Os ' + n(M.nExtra) + " personagens que faltam na API (Nappa, Forças Ginyu, Chaos) entram pela curadoria.</div>";

  $("stack").innerHTML = '<div class="stack">' + ["Python", "pandas", "pytest", "SQL Server", "T-SQL", "Power BI", "DAX", "TMDL / PBIP", "HTML · CSS · JS", "Git"].map(function (s) { return "<span>" + s + "</span>"; }).join("") + "</div>" +
    '<div class="gh"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.9 1.3 1.9 1.3 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.3-.5-1.6.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>' +
    '<div><div class="u">github.com/Deogadox/scouter-bi</div><div class="s">Felipe Rios Miranda · Engenharia de Dados e BI</div></div></div>';
})();
</script>
