<script>
(function () {
  var D = U.D, $ = function (id) { return document.getElementById(id); }, app = $("app");
  app.insertAdjacentHTML("beforeend", U.marca("Arena"));
  var lados = [null, null], ativo = 0, busca = "";

  function opcoes(p) { return (D.podByPer[p.id] || []).slice().sort(function (a, b) { return a.s - b.s || a.v - b.v; }); }
  function melhor(p) { return opcoes(p).reduce(function (m, r) { return !m || r.v > m.v ? r : m; }, null); }

  /* ---------- seleção */
  function grade() {
    var q = busca.trim().toLowerCase(), h = "";
    D.perOrdem.forEach(function (p) {
      if (q && (U.nome(p) + " " + p.n).toLowerCase().indexOf(q) < 0) return;
      var a = lados[0] && lados[0].p.id === p.id, b = lados[1] && lados[1].p.id === p.id;
      h += '<div class="tl' + (a ? " sa" : "") + (b ? " sb" : "") + '" data-id="' + p.id + '">' + '<div class="ret">' + U.retrato(p, "", U.aura("")) + "</div>" +
        '<div class="fx"></div><div class="nm">' + U.esc(U.nome(p)) + '</div><div class="pk">pico ' + U.fmt(p.pico) + "</div>" +
        (a ? '<span class="tag a">A</span>' : "") + (b ? '<span class="tag b">B</span>' : "") + "</div>";
    });
    $("gradeA").innerHTML = h;
  }
  function definir(i, p, r) {
    lados[i] = { p: p, r: r || melhor(p) };
    ladoUI(i); grade(); odds();
    if (i === 0 && !lados[1]) alvo(1); else if (i === 1 && !lados[0]) alvo(0);
  }
  function alvo(i) {
    ativo = i;
    [].forEach.call(document.querySelectorAll(".alvo .chip"), function (c) { c.classList.toggle("on", +c.dataset.l === i); });
    $("ladoA").classList.toggle("ativo", i === 0); $("ladoB").classList.toggle("ativo", i === 1);
  }
  function ladoUI(i) {
    var el = $(i ? "ladoB" : "ladoA"), L = lados[i];
    if (!L) return;
    var cor = U.aura(L.r.f);
    el.style.setProperty("--aura", cor + "88");
    el.querySelector(".vaz").style.display = "none";
    el.querySelector(".ret").innerHTML = U.retrato(L.p, L.r.fi || L.p.img, cor);
    el.querySelector(".nm").textContent = U.nome(L.p);
    el.querySelector(".pw").textContent = U.fmt(L.r.v) + " · " + L.r.f;
    $(i ? "auxB" : "auxA").textContent = U.sagaCurta(L.r.s);
    el.querySelector(".ops").innerHTML = opcoes(L.p).map(function (r, k) {
      return '<div class="op' + (r === L.r ? " on" : "") + '" data-k="' + k + '"><span><span class="sg">' + U.esc(U.sagaCurta(r.s)) + ' · </span><span class="fm">' + U.esc(r.f) + '</span></span><span class="v">' + U.fmt(r.v) + "</span></div>";
    }).join("");
    var on = el.querySelector(".op.on"), box = el.querySelector(".ops");
    if (on) box.scrollTop = on.offsetTop - box.offsetTop - 60;
  }
  function chance(a, b) { return a * a / (a * a + b * b); }
  function odds() {
    var A = lados[0], B = lados[1];
    $("oA").textContent = A ? U.nome(A.p) + " · " + Math.round((B ? chance(A.r.v, B.r.v) : .5) * 100) + "%" : "Lado A";
    $("oB").textContent = B ? Math.round((A ? chance(B.r.v, A.r.v) : .5) * 100) + "% · " + U.nome(B.p) : "Lado B";
    $("oBar").style.width = (A && B ? chance(A.r.v, B.r.v) * 100 : 50) + "%";
    $("btnLutar").disabled = !(A && B);
  }

  $("gradeA").addEventListener("click", function (e) { var t = e.target.closest(".tl"); if (t) definir(ativo, D.perById[+t.dataset.id]); });
  $("buscaA").addEventListener("input", function (e) { busca = e.target.value; grade(); });
  document.querySelector(".alvo").addEventListener("click", function (e) { var c = e.target.closest(".chip"); if (c) alvo(+c.dataset.l); });
  ["ladoA", "ladoB"].forEach(function (id, i) {
    $(id).addEventListener("click", function (e) {
      var o = e.target.closest(".op");
      if (o) { lados[i].r = opcoes(lados[i].p)[+o.dataset.k]; ladoUI(i); odds(); }
      else alvo(i);
    });
  });
  $("btnSortear").addEventListener("click", function () {
    var ps = D.per.slice().sort(function () { return Math.random() - .5; });
    [0, 1].forEach(function (i) { var op = opcoes(ps[i]); lados[i] = { p: ps[i], r: op[Math.floor(Math.random() * op.length)] }; ladoUI(i); });
    grade(); odds();
  });

  /* ---------- motor de batalha (calibrado para seguir o modelo A²/(A²+B²)) */
  var K = 0.25, BASE = 120, VAR = 200;
  function novaLuta() {
    var a = lados[0].r.v, b = lados[1].r.v;
    return { hp: [1000, 1000], esp: [0, 0], vez: Math.random() < 0.35 + 0.3 * chance(a, b) ? 0 : 1, turno: 0, fim: false,
      st: { dano: [0, 0], crit: [0, 0], esq: [0, 0], golpes: [0, 0] } };
  }
  function golpe(L, silencioso) {
    var a = L.vez, d = 1 - a, A = lados[a], B = lados[d], ratio = A.r.v / B.r.v, g = U.golpes(A.p);
    var ev = { a: a, d: d, esp: false, crit: false, esq: false, dano: 0 };
    if (!L.esp[a] && L.hp[a] < 400 && Math.random() < 0.55) { ev.esp = true; L.esp[a] = 1; ev.golpe = g[1]; }
    else ev.golpe = g[0][Math.floor(Math.random() * g[0].length)];
    if (!ev.esp && /kaioken/i.test(A.r.f) && Math.random() < .5) ev.golpe = "Kaioken + " + ev.golpe;
    var pEsq = U.clamp(0.08 - 0.10 * Math.log10(ratio), 0.02, 0.32);
    if (!ev.esp && Math.random() < pEsq) ev.esq = true;
    else {
      var dano = (BASE + Math.random() * VAR) * U.clamp(Math.pow(ratio, K), 0.05, 20);
      if (ev.esp) dano *= 2.3;
      if (Math.random() < 0.12) { dano *= 1.6; ev.crit = true; }
      ev.dano = Math.min(1000, Math.round(dano));
    }
    L.hp[d] = Math.max(0, L.hp[d] - ev.dano);
    L.st.dano[a] += ev.dano; L.st.golpes[a]++; if (ev.crit) L.st.crit[a]++; if (ev.esq) L.st.esq[d]++;
    L.turno++; L.vez = d;
    if (L.hp[d] <= 0) { L.fim = true; L.venc = a; }
    return ev;
  }

  /* ---------- cena */
  var luta = null, auto = false, vel = 1, ocupado = false, token = 0;
  function cenario(s) { return s >= 2 && s <= 4 ? "cen-namek" : s >= 6 && s <= 10 ? "cen-cell" : s >= 11 ? "cen-buu" : "cen-terra"; }
  function montanhas() {
    function serra(y0, amp, n, seed) {
      var d = "M0 230 L0 " + y0, x = 0, r = seed;
      for (var i = 0; i <= n; i++) { r = (r * 9301 + 49297) % 233280; x = i * 1248 / n; d += " L" + x.toFixed(0) + " " + (y0 - amp * (r / 233280)).toFixed(0); }
      return d + " L1248 230 Z";
    }
    $("mont1").setAttribute("d", serra(120, 110, 14, 7)); $("mont2").setAttribute("d", serra(180, 80, 22, 3));
  }
  function hud(i) {
    var el = $(i ? "hudB" : "hudA"), L = lados[i], hp = luta.hp[i], pct = hp / 10;
    el.querySelector(".n").textContent = U.nome(L.p);
    el.querySelector(".s").textContent = L.r.f + " · " + U.sagaCurta(L.r.s);
    el.querySelector(".vida").style.width = pct + "%";
    el.querySelector(".vida").style.background = pct > 50 ? "linear-gradient(90deg,#2ee67a,#39ff88)" : pct > 22 ? "linear-gradient(90deg,#ffb02e,#ffd23f)" : "linear-gradient(90deg,#ff3b3b,#ff6b6b)";
    el.querySelector(".rast").style.width = pct + "%";
    el.querySelector(".hv").textContent = "HP " + hp + "/1000";
    el.querySelector(".pw").textContent = "poder " + U.fmt(L.r.v);
  }
  function entrar() {
    token++; luta = novaLuta(); ocupado = false;
    var arena = $("arena");
    arena.className = "on " + cenario(lados[0].r.s); app.classList.add("batalha"); montanhas();
    [0, 1].forEach(function (i) {
      var L = lados[i], el = $(i ? "luB" : "luA"), cor = U.aura(L.r.f);
      el.className = "luta"; el.style.setProperty("--aura", cor);
      el.querySelector(".ret").innerHTML = U.retrato(L.p, L.r.fi || L.p.img, cor);
      hud(i);
    });
    $("logL").innerHTML = "";
    registrar("A luta começou! <b class='" + (luta.vez ? "b" : "a") + "'>" + U.esc(U.nome(lados[luta.vez].p)) + "</b> ataca primeiro.");
    $("turnoT").textContent = "TURNO 1";
    banner("LUTEM!", "#ff8a00");
    $("mFim").classList.remove("on"); $("mSim").classList.remove("on");
    botoes();
    if (auto) agendar(1300);
  }
  function registrar(html) {
    var l = $("logL"); l.insertAdjacentHTML("afterbegin", '<div class="ln">' + html + "</div>");
    while (l.children.length > 5) l.removeChild(l.lastChild);
  }
  function banner(txt, cor) { var b = $("banner"); b.textContent = txt; b.style.setProperty("--bc", cor); b.classList.remove("on"); void b.offsetWidth; b.classList.add("on"); }
  function botoes() { $("bProx").disabled = !luta || luta.fim || ocupado; $("bAuto").classList.toggle("on", auto); $("bVel").textContent = vel + "×"; }
  function agendar(ms) { var t = token; setTimeout(function () { if (t === token && auto && luta && !luta.fim && !ocupado) turno(); }, ms / vel); }

  function turno() {
    if (!luta || luta.fim || ocupado) return;
    ocupado = true; botoes();
    var t = token, ev = golpe(luta), f = 1 / vel;
    var At = $(ev.a ? "luB" : "luA"), Df = $(ev.d ? "luB" : "luA"), dir = ev.a ? -1 : 1;
    var corA = U.aura(lados[ev.a].r.f);
    $("turnoT").textContent = "TURNO " + luta.turno;
    At.style.transform = "translateX(" + 40 * dir + "px)";
    if (ev.esp) { banner(ev.golpe.toUpperCase() + "!", corA); }
    setTimeout(function () {
      if (t !== token) return;
      var r = $("raio"), x1 = ev.a ? 1248 - 110 - 210 : 110 + 210, x2 = ev.a ? 110 + 150 : 1248 - 110 - 150;
      var esq = Math.min(x1, x2), larg = Math.abs(x2 - x1);
      r.style.transition = "none"; r.style.left = (ev.a ? x1 : esq) + "px"; r.style.width = "0px"; r.style.opacity = 1;
      r.style.height = ev.esp ? "44px" : "22px"; r.style.top = ev.esp ? "381px" : "392px";
      r.style.background = "linear-gradient(90deg," + corA + "," + (ev.esp ? "#ffffff" : corA) + ")";
      r.style.boxShadow = "0 0 24px " + corA + ", 0 0 60px " + corA;
      void r.offsetWidth;
      r.style.transition = "left " + 0.22 * f + "s linear, width " + 0.22 * f + "s linear";
      if (ev.a) r.style.left = esq + "px";
      r.style.width = larg + "px";
    }, 160 * f);
    setTimeout(function () {
      if (t !== token) return;
      var imp = $("impacto"), xi = ev.d ? 1248 - 110 - 140 : 110 + 140;
      imp.style.left = xi + "px"; imp.style.transition = "none"; imp.style.opacity = 1; imp.style.transform = "scale(.3)";
      void imp.offsetWidth; imp.style.transition = "all " + 0.4 * f + "s ease-out"; imp.style.transform = "scale(" + (ev.esp ? 2.2 : ev.crit ? 1.5 : 1) + ")"; imp.style.opacity = 0;
      var num = document.createElement("div");
      num.className = "dano" + (ev.crit ? " crit" : "") + (ev.esq ? " esq" : "");
      num.textContent = ev.esq ? "ESQUIVOU!" : (ev.crit ? "CRÍTICO! " : "") + "-" + ev.dano;
      num.style.left = (xi - 60 + (Math.random() * 40 - 20)) + "px"; num.style.top = "290px";
      $("arena").appendChild(num); setTimeout(function () { num.remove(); }, 1300);
      if (ev.esq) { Df.style.transform = "translate(" + (-30 * dir) + "px,-30px)"; }
      else { Df.classList.remove("hit"); void Df.offsetWidth; Df.classList.add("hit"); if (ev.esp || ev.crit) { $("flash").classList.remove("on"); void $("flash").offsetWidth; $("flash").classList.add("on"); } }
      hud(ev.d);
      var na = "<b class='" + (ev.a ? "b" : "a") + "'>" + U.esc(U.nome(lados[ev.a].p)) + "</b>", nd = "<b class='" + (ev.d ? "b" : "a") + "'>" + U.esc(U.nome(lados[ev.d].p)) + "</b>";
      registrar(ev.esq ? na + " usou " + U.esc(ev.golpe) + ", mas " + nd + " esquivou!" :
        (ev.esp ? "<span class='c'>ESPECIAL!</span> " : ev.crit ? "<span class='c'>CRÍTICO!</span> " : "") + na + " usou " + U.esc(ev.golpe) + " <span class='d'>−" + ev.dano + "</span>");
    }, 400 * f);
    setTimeout(function () {
      if (t !== token) return;
      $("raio").style.opacity = 0; At.style.transform = ""; Df.style.transform = ""; Df.classList.remove("hit");
      ocupado = false;
      if (luta.fim) fim(); else { botoes(); if (auto) agendar(700); }
    }, 950 * f);
  }

  function fim() {
    var v = luta.venc, p = 1 - v, ch = chance(lados[v].r.v, lados[p].r.v);
    $(p ? "luB" : "luA").classList.add("ko");
    registrar("<b class='" + (v ? "b" : "a") + "'>" + U.esc(U.nome(lados[v].p)) + "</b> venceu em " + luta.turno + " golpes!");
    banner("K.O.!", "#ff4d5e"); botoes();
    setTimeout(function () {
      $("fimV").innerHTML = "VITÓRIA DE <span style='color:" + (v ? "var(--bl2)" : "var(--or)") + "'>" + U.esc(U.nome(lados[v].p).toUpperCase()) + "</span>";
      $("fimS").textContent = ch < 0.35 ? "Zebra! O modelo dava só " + Math.round(ch * 100) + "% de chance para esse resultado." : "O modelo dava " + Math.round(ch * 100) + "% de chance para esse resultado.";
      var s = luta.st;
      $("fimG").innerHTML = "<div><b>" + luta.turno + "</b><span>golpes</span></div><div><b>" + s.dano[v] + "</b><span>dano causado</span></div>" +
        "<div><b>" + s.crit[v] + "</b><span>críticos</span></div><div><b>" + luta.hp[v] + "</b><span>HP restante</span></div>";
      $("mFim").classList.add("on");
    }, 1400);
  }

  function simular() {
    $("mFim").classList.remove("on"); auto = false; token++; ocupado = false; botoes();
    var m = $("mSim"); m.classList.add("on"); $("simBar").style.width = "50%"; $("simS").textContent = "calculando…";
    setTimeout(function () {
      var w = 0, tt = 0, zeb = 0, n = 1000, chA = chance(lados[0].r.v, lados[1].r.v);
      for (var i = 0; i < n; i++) { var L = novaLuta(); while (!L.fim && L.turno < 300) golpe(L, true); if (L.venc === 0) w++; tt += L.turno; }
      $("simBar").style.width = w / n * 100 + "%";
      $("simA").textContent = U.nome(lados[0].p) + " " + w.toLocaleString("pt-BR");
      $("simB").textContent = (n - w).toLocaleString("pt-BR") + " " + U.nome(lados[1].p);
      $("simS").textContent = "Mesmo motor da luta animada, rodado 1.000 vezes.";
      $("simG").innerHTML = "<div><b>" + (w / 10).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%</b><span>vitórias de A</span></div>" +
        "<div><b>" + (chA * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%</b><span>previsto pelo modelo</span></div>" +
        "<div><b>" + (tt / n).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "</b><span>golpes por luta</span></div>";
    }, 450);
  }
  function sair() { token++; auto = false; luta = null; $("arena").className = ""; app.classList.remove("batalha"); }

  $("btnLutar").addEventListener("click", entrar);
  $("bProx").addEventListener("click", turno);
  $("bAuto").addEventListener("click", function () { auto = !auto; botoes(); if (auto) agendar(200); });
  $("bVel").addEventListener("click", function () { vel = vel === 1 ? 2 : vel === 2 ? 3 : 1; botoes(); });
  $("bRev").addEventListener("click", entrar); $("fRev").addEventListener("click", entrar);
  $("bSim").addEventListener("click", simular); $("fSim").addEventListener("click", simular);
  $("sOk").addEventListener("click", function () { $("mSim").classList.remove("on"); if (luta && luta.fim) $("mFim").classList.add("on"); });
  $("bSair").addEventListener("click", sair); $("fSair").addEventListener("click", sair);

  grade();
  var g = U.porNome("Goku"), f = U.porNome("Freezer");
  if (g && f) {
    var rg = opcoes(g).filter(function (r) { return r.s === 4 && r.f === "SSJ"; })[0], rf = opcoes(f).filter(function (r) { return r.s === 4 && r.f === "Forma final"; })[0];
    definir(0, g, rg); definir(1, f, rf); alvo(0);
  }
  odds();
})();
</script>
